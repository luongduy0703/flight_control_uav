# Camera -> than FC (Pixhawk, FRD: x truoc, y phai, z xuong): p_B = R_BC p_C + t_BC.
# Camera C theo OpenCV (x phai anh, y xuong anh, z truc quang = nhin xuong).
# !!! CHUA HIEU CHUAN: gia tri DANH NGHIA theo cach gan (camera nhin thang xuong, canh tren anh huong ve mui UAV,
#     tam camera trung tam FC). Sai R_BC lam ROI du doan theo tu the FC lech (flow / Kalman van sua duoc vai chuc px),
#     va lam sai p_W. Do lai: cho UAV nghieng / quay tai cho, so dich chuyen anh voi ATTITUDE (hoac Kalibr cam-IMU),
#     do t_BC bang thuoc. Hieu chuan lai: sao luu file nay truoc, ghi bo so moi, tang version.
