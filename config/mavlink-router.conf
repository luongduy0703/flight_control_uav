# TEMPLATE for the ONE mavlink-routerd on the Pi, started by hand.
# Do not copy by hand: tools/run_hardware_router.sh PC_IPV4 [/dev/ttyAMA0] fills __SERIAL_DEVICE__ and
# __PC_IPV4__ into a temporary file and runs mavlink-routerd in the foreground (Ctrl+C stops it).
# mavlink-router.service stays disabled, so nothing (QGC included) connects until you run the script.
#
#   Pixhawk TELEM1 --UART 921600-- /dev/ttyAMA0 -- mavlink-routerd --+-- UDP 127.0.0.1:14540  control console (MAVSDK 1/195)
#                                                                    +-- UDP 127.0.0.1:14551  uavp_fc_bridge  (perception 1/191)
#                                                                    +-- UDP <laptop>:14550   QGroundControl (auto-connect)
#                                                                    +-- UDP <laptop>:14560   tools/drift_viewer.py (read-only)
#
# Rules:
#   * Nothing else may open the serial device (not the console, not uavp_fc_bridge, not MicroXRCEAgent,
#     not a second mavlink-routerd). Check: sudo fuser -v /dev/ttyAMA0  -> only mavlink-routerd.
#   * Pi <-> Pixhawk is TELEM1 <-> GPIO14/15 only (no USB cable). TELEM1 pin 2 TX -> Pi pin 10, pin 3 RX
#     <- Pi pin 8, pin 6 GND -> Pi pin 6 (GND is required without USB). Never wire pin 1 (5V) to a GPIO.
#   * Only the control console sends flight commands. Perception sends HEARTBEAT and COMMAND_ACK only.
#   * PX4: MAV_0_CONFIG=101 (TELEM1), MAV_0_MODE=2 (Onboard), MAV_0_RATE=0, MAV_0_FORWARD=0,
#     MAV_0_FLOW_CTRL=0 (CTS/RTS not wired), SER_TEL1_BAUD=921600, MAV_1_CONFIG=0 (TELEM2 TX pin is dead),
#     UXRCE_DDS_CFG=0. If SER_TEL1_BAUD changes, change Baud below at the same time.

[General]
TcpServerPort = 0

[UartEndpoint pixhawk]
Device = __SERIAL_DEVICE__
Baud = 921600

# pi/console.py --connection udpin://127.0.0.1:14540
[UdpEndpoint control]
Mode = Normal
Address = 127.0.0.1
Port = 14540

# his_perception_uav-main configs/run/real_time.yaml: sources.mavlink.link=udp, udp_port=14551
[UdpEndpoint uavp]
Mode = Normal
Address = 127.0.0.1
Port = 14551

# QGroundControl on the laptop. The Pi sends first, so QGC's default UDP 14550 auto-connect works.
# Laptop IP changes with DHCP: rerun tools/run_hardware_router.sh with the new IP.
[UdpEndpoint qgc]
Mode = Normal
Address = __PC_IPV4__
Port = 14550

# Drift trajectory viewer on the laptop: python3 tools/drift_viewer.py (listens, never sends).
# Nothing listening on 14560 is harmless (UDP packets are just dropped).
[UdpEndpoint drift]
Mode = Normal
Address = __PC_IPV4__
Port = 14560
